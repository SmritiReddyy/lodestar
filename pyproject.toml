[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar-ingest"
version = "0.1.0"
description = "Lodestar ELT analytics platform - extract & load layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
# Local/CI stack: DuckDB warehouse, dbt, data quality. No cloud credentials.
dev = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "great_expectations>=1.3",
    "pandas>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Deployed stack: GCS landing zone, BigQuery warehouse.
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
    "dbt-bigquery>=1.9",
]

[project.scripts]
lodestar-ingest = "lodestar_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt_project/target", "dbt_project/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ingestion"]

[tool.ruff.lint.isort]
known-first-party = ["lodestar_ingest", "quality"]
